<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judson Product Search</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="tailwind.generated.css" />
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    window.process = window.process || { env: { NODE_ENV: 'production' } };
  </script>
  <script type="importmap">
    {
      "imports": {
        "@tanstack/table-core": "/vendor/tanstack-table-core/index.js",
        "@tanstack/table-core/store-reactivity-bindings": "/vendor/tanstack-table-core/store-reactivity-bindings.js",
        "@tanstack/store": "/vendor/tanstack-store/index.js"
      }
    }
  </script>
</head>
<body class="app-body min-h-screen px-4 py-8 transition-colors duration-300">
  <header class="max-w-[820px] mx-auto mb-8">
    <div class="flex justify-end mb-4">
      <button id="themeToggle" type="button" class="theme-toggle" aria-pressed="false">
        <i id="themeIcon" class="fas fa-moon"></i>
        <span class="ml-2">Light theme</span>
      </button>
    </div>
    <h1 class="font-display text-4xl font-bold text-center mb-2 tracking-tight">Judson Product Search</h1>
    <p id="dbCreatedAt" class="hidden text-center text-sm app-muted">Loading database date…</p>
    <!-- Login Form -->
    <form id="loginForm" class="hidden app-card mb-6 max-w-md mx-auto p-6 rounded-xl flex flex-col gap-4">
      <label for="password" class="text-sm font-medium app-label">Enter Password to Access</label>
      <input type="password" id="password" class="app-input p-3 rounded-lg focus:outline-none" placeholder="Password" required />
      <button type="submit" class="app-primary-btn font-semibold py-2.5 rounded-lg">Login</button>
      <div id="loginError" class="text-red-400 text-sm text-center hidden"></div>
    </form>
  </header>

  <!-- Main UI hidden until login -->
  <div id="mainUI" class="hidden">
    <header class="max-w-[820px] mx-auto search-header">
      <div class="relative">
        <input
          type="text"
          id="searchInput"
          class="app-input w-full p-4 pr-12 rounded-xl transition"
          placeholder="Search for a product..."
        />
        <button
          type="button"
          id="clearSearchButton"
          class="clear-search-btn absolute right-3 top-1/2 -translate-y-1/2 hidden"
          aria-label="Clear search"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
    </header>
    <div class="max-w-[820px] mx-auto column-controls" role="group" aria-label="Toggle table columns">
      <span class="column-controls-label text-xs uppercase tracking-wider app-muted">Columns</span>
      <div id="columnControls" class="column-toggles">
        <!-- Dynamic column toggles will be inserted here -->
      </div>
    </div>
    <main class="w-full">
      <div class="app-table-shell max-w-[820px] mx-auto rounded-xl overflow-x-auto">
        <table id="resultTable" class="app-table w-full text-left border-collapse">
          <colgroup id="resultTableColGroup"></colgroup>
          <thead id="resultTableHead" class="app-table-head">
            <!-- Dynamic headers will be inserted here -->
          </thead>
          <tbody id="resultTableBody" class="app-table-body">
            <!-- Dynamic rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
